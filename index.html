    <script type="module">
      // Create a truly transparent favicon from the source image (removes white/checker background).
      const THRESHOLD = 45;

      const dist = (a, r, g, b) => {
        const dr = a.r - r;
        const dg = a.g - g;
        const db = a.b - b;
        return Math.sqrt(dr * dr + dg * dg + db * db);
      };

      const avgCorner = (data, w, h, x0, y0, size = 6) => {
        let r = 0, g = 0, b = 0, n = 0;
        const x1 = Math.min(w - 1, x0 + size);
        const y1 = Math.min(h - 1, y0 + size);
        for (let y = y0; y <= y1; y++) {
          for (let x = x0; x <= x1; x++) {
            const i = (y * w + x) * 4;
            r += data[i];
            g += data[i + 1];
            b += data[i + 2];
            n++;
          }
        }
        return { r: r / n, g: g / n, b: b / n };
      };

      const makeTransparentFavicon = async () => {
        try {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.src = "/favicon.png?v=5";
          await img.decode();

          const size = 64;
          const canvas = document.createElement("canvas");
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext("2d");
          if (!ctx) return;

          ctx.drawImage(img, 0, 0, size, size);
          const imageData = ctx.getImageData(0, 0, size, size);
          const { data } = imageData;
          const w = size;
          const h = size;

          const samples = [
            avgCorner(data, w, h, 0, 0),
            avgCorner(data, w, h, w - 7, 0),
            avgCorner(data, w, h, 0, h - 7),
            avgCorner(data, w, h, w - 7, h - 7),
          ];

          const minDist = (r, g, b) => {
            let m = Infinity;
            for (const s of samples) m = Math.min(m, dist(s, r, g, b));
            return m;
          };

          const isBg = (p) => {
            const i = p * 4;
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            return minDist(r, g, b) < THRESHOLD;
          };

          const visited = new Uint8Array(w * h);
          const stack = [];
          const pushIfBg = (x, y) => {
            const p = y * w + x;
            if (visited[p]) return;
            if (!isBg(p)) return;
            visited[p] = 1;
            stack.push(p);
          };

          for (let x = 0; x < w; x++) {
            pushIfBg(x, 0);
            pushIfBg(x, h - 1);
          }
          for (let y = 0; y < h; y++) {
            pushIfBg(0, y);
            pushIfBg(w - 1, y);
          }

          while (stack.length) {
            const p = stack.pop();
            const x = p % w;
            const y = (p / w) | 0;
            if (x > 0) pushIfBg(x - 1, y);
            if (x < w - 1) pushIfBg(x + 1, y);
            if (y > 0) pushIfBg(x, y - 1);
            if (y < h - 1) pushIfBg(x, y + 1);
          }

          for (let p = 0; p < visited.length; p++) {
            if (visited[p]) data[p * 4 + 3] = 0;
          }

          ctx.putImageData(imageData, 0, 0);

          const faviconUrl = canvas.toDataURL("image/png");
          let link = document.querySelector('link[rel="icon"]');
          if (!link) {
            link = document.createElement("link");
            link.rel = "icon";
            document.head.appendChild(link);
          }
          link.type = "image/png";
          link.href = faviconUrl;
        } catch {
          // Ignore favicon processing errors.
        }
      };

      makeTransparentFavicon();
    </script>
